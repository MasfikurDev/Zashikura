[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/application",
    "crates/platform",
    "crates/storage",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/MasfikurDev/Zashikura"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
